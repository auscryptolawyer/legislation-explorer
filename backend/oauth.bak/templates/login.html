<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Legislation Explorer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a1214; color: #aebec2; display: flex;
            justify-content: center; align-items: center; min-height: 100vh;
        }
        .card {
            background: #152025; border-radius: 12px; padding: 40px;
            width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #279e88; }
        p { font-size: 14px; margin-bottom: 24px; color: #7a8f94; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #8fa5aa; }
        input[type="password"], input[type="text"] {
            width: 100%; padding: 12px; border: 1px solid #2a3a40;
            background: #0d181c; color: #aebec2; border-radius: 8px;
            font-size: 14px; margin-bottom: 20px; outline: none;
        }
        input:focus { border-color: #279e88; }
        button {
            width: 100%; padding: 12px; background: #279e88; color: #fff;
            border: none; border-radius: 8px; font-size: 16px; cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #2db898; }
        .hint { font-size: 12px; color: #5a7075; margin-top: 16px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Legislation Explorer</h1>
        <p>Sign in to authorize <strong>{{client_name}}</strong></p>
        <form method="POST" action="/oauth/authorize">
            <input type="hidden" name="action" value="login">
            <input type="hidden" name="auth_params" value="{{auth_params}}">
            <label for="token">Access Token</label>
            <input type="password" id="token" name="token" placeholder="Enter your MCP access token" required autofocus>
            <button type="submit">Sign In</button>
        </form>
        <div class="hint">
            Need a token? Generate one from the Legislation Explorer web interface.
        </div>
    </div>
</body>
</html>
