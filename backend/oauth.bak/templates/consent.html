<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize - Legislation Explorer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a1214; color: #aebec2; display: flex;
            justify-content: center; align-items: center; min-height: 100vh;
        }
        .card {
            background: #152025; border-radius: 12px; padding: 40px;
            width: 100%; max-width: 480px; box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #279e88; }
        .subtitle { font-size: 14px; margin-bottom: 24px; color: #7a8f94; }
        .scope-list { background: #0d181c; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
        .scope-list h3 { font-size: 13px; color: #8fa5aa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .scope-item { padding: 8px 0; border-bottom: 1px solid #1a2a30; font-size: 14px; }
        .scope-item:last-child { border-bottom: none; }
        .btn-group { display: flex; gap: 12px; }
        .btn-authorize {
            flex: 1; padding: 12px; background: #279e88; color: #fff;
            border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600;
        }
        .btn-authorize:hover { background: #2db898; }
        .btn-deny {
            flex: 1; padding: 12px; background: #2a3a40; color: #8fa5aa;
            border: none; border-radius: 8px; font-size: 16px; cursor: pointer;
        }
        .btn-deny:hover { background: #3a4a50; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Authorize Access</h1>
        <p class="subtitle"><strong>{{client_name}}</strong> is requesting access to your account</p>
        <div class="scope-list">
            <h3>Requested Permissions</h3>
            <div class="scope-item">🔍 Read legislation, rulings, and case law</div>
            <div class="scope-item">📄 Access section definitions and commentary</div>
        </div>
        <form method="POST" action="/oauth/authorize">
            <input type="hidden" name="action" value="authorize">
            <input type="hidden" name="response_type" value="{{response_type}}">
            <input type="hidden" name="client_id" value="{{client_id}}">
            <input type="hidden" name="redirect_uri" value="{{redirect_uri}}">
            <input type="hidden" name="scope" value="{{scope}}">
            <input type="hidden" name="state" value="{{state}}">
            <input type="hidden" name="code_challenge" value="{{code_challenge}}">
            <input type="hidden" name="code_challenge_method" value="{{code_challenge_method}}">
            <div class="btn-group">
                <button type="submit" class="btn-authorize" name="action" value="authorize">Authorize</button>
                <button type="submit" class="btn-deny" name="action" value="deny">Deny</button>
            </div>
        </form>
    </div>
</body>
</html>
