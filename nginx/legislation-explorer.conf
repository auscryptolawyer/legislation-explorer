
# Rate limiting zone (must be in http block)
limit_req_zone $binary_remote_addr zone=legislation:10m rate=10r/s;

server {
    listen 80;
    server_name legislation.scriptkitty.yachts;

    # Rate limiting
    limit_req zone=legislation burst=20 nodelay;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        root /home/harrison/legislation-explorer/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        root /home/harrison/legislation-explorer/frontend/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /mcp/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SSL stub (uncomment after certbot)
    #listen 443 ssl http2;
    #ssl_certificate /etc/letsencrypt/live/legislation.scriptkitty.yachts/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/legislation.scriptkitty.yachts/privkey.pem;
}
